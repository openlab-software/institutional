name: Build and Publish

# CI builds/pushes the image and publishes the Helm chart (OCI).
# The image tag in .devops/k8s is updated by the ArgoCD Image Updater, not by CI.
# Deploying is ArgoCD's job: it watches .devops/k8s and syncs the cluster.

on:
  # Release pipeline: creating a tag like v1.2.3 builds and publishes the image
  # tagged with that version (semver, which is what the Image Updater expects).
  push:
    tags: ['v*.*.*']
  # PRs only build (validates the Dockerfile), nothing is pushed.
  pull_request:
    branches: [main]

env:
  IMAGE: ghcr.io/openlab-software/institutional
  # Helm chart OCI: publicado como ghcr.io/openlab-software/charts/institutional
  CHART_REPO: ghcr.io/openlab-software/charts
  # Git tag on release pushes; commit sha on PR builds (never pushed).
  IMAGE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devops/docker/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  chart:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      # PRs e releases: valida o chart e confere que ele renderiza
      - name: Lint and template
        run: |
          helm lint .devops/helm
          helm template institutional .devops/helm --namespace institutional > /dev/null

      - name: Log in to registry
        if: github.event_name == 'push'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      # Chart version = tag sem o "v" (v1.2.3 -> 1.2.3); appVersion = tag, que é a tag da imagem
      - name: Package and push chart
        if: github.event_name == 'push'
        run: |
          helm package .devops/helm --version "${IMAGE_TAG#v}" --app-version "${IMAGE_TAG}"
          helm push "institutional-${IMAGE_TAG#v}.tgz" "oci://${CHART_REPO}"

