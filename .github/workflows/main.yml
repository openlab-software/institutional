name: Build, Publish and Bump manifests

# CI builds/pushes the image and bumps its tag in .devops/k8s/kustomization.yaml.
# Deploying is ArgoCD's job: it watches .devops/k8s and syncs the cluster.

on:
  # Release pipeline: creating a tag like v1.2.3 builds and publishes the image
  # tagged with that version (semver, which is what the Image Updater expects).
  push:
    tags: ['v*.*.*']
  # PRs only build (validates the Dockerfile), nothing is pushed.
  pull_request:
    branches: [main]

env:
  IMAGE: ghcr.io/openlab-software/institutional
  # Git tag on release pushes; commit sha on PR builds (never pushed).
  IMAGE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devops/docker/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  bump-manifests:
    needs: image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Serialize bumps so concurrent pushes don't race on the manifests commit.
    concurrency:
      group: bump-manifests
      cancel-in-progress: false
    steps:
      # A tag push checks out a detached HEAD; bump on top of main instead.
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update manifests
        working-directory: .devops/k8s
        # kustomize is preinstalled on ubuntu-latest runners
        run: kustomize edit set image "${IMAGE}=${IMAGE}:${IMAGE_TAG}"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .devops/k8s
          git diff --cached --quiet && exit 0
          git commit -m "chore(k8s): deploy ${IMAGE_TAG} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
