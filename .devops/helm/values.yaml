replicaCount: 1

image:
  repository: ghcr.io/openlab-software/institutional
  # Vazio = usa .Chart.AppVersion (a tag da release, definida pela CI no package)
  tag: ""
  pullPolicy: IfNotPresent

service:
  port: 80

ingress:
  enabled: true
  # Mesma classe do ingress-nginx instalado pelo repositório infrastructure
  className: nginx
  hosts:
    # Site público (Cloudflare Tunnel). O /erp do mesmo host fica no Ingress do erp:
    # o nginx escolhe o prefixo mais longo, então / aqui não conflita.
    - openlab.software
    # kind local (localtest.me resolve para 127.0.0.1)
    - institutional.localtest.me

resources:
  requests: { cpu: 10m, memory: 16Mi }
  limits: { memory: 64Mi }
