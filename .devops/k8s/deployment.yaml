apiVersion: apps/v1
kind: Deployment
metadata:
  name: institutional
  namespace: institutional
spec:
  replicas: 1
  selector:
    matchLabels:
      app: institutional
  template:
    metadata:
      labels:
        app: institutional
    spec:
      containers:
        - name: institutional
          image: ghcr.io/openlab-software/institutional:v0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: institutional
  namespace: institutional
spec:
  type: ClusterIP
  selector:
    app: institutional
  ports:
    - name: http
      port: 80
      targetPort: http
