apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: institutional
  namespace: institutional
spec:
  # Mesma classe do ingress-nginx instalado pelo repositório infrastructure
  ingressClassName: nginx
  rules:
    # Site público (Cloudflare Tunnel). O /erp do mesmo host fica no Ingress do erp:
    # o nginx escolhe o prefixo mais longo, então / aqui não conflita.
    - host: openlab.software
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: institutional, port: { name: http } }
    # kind local (localtest.me resolve para 127.0.0.1)
    - host: institutional.localtest.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: institutional, port: { name: http } }
