server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Assets do Vite têm hash no nome: cache longo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: qualquer rota desconhecida cai no index.html (sem cache, para pegar deploys novos)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
